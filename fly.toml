# fly.toml app configuration file generated for leadsales-reverse on 2026-10-30T15:37:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'leadsales-reverse'
primary_region = 'ams'

[build]
  dockerfile = 'deploy/fly/Dockerfile'

[env]
  ALLOW_SIGNUP = 'true'
  BILLING_MODE = 'meta_direct'
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'leadlibre_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
