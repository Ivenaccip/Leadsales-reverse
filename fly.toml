# LeadLibre en Fly.io: una sola máquina con un volumen en /data (base de datos embebida,
# archivos y llaves). Paso a paso en docs/04-despliegue.md, "Fly.io".
#
# Cambia "leadlibre-tucomunidad" por el nombre de tu app. La dirección pública es
# https://<app>.fly.dev; con dominio propio, agrega PUBLIC_URL en [env].
app = "leadlibre-tucomunidad"
# Dallas: la región de Fly más cercana a México. Lista: fly platform regions
primary_region = "dfw"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  DATA_DIR = "/data"
  ALLOW_SIGNUP = "true"
  BILLING_MODE = "meta_direct"

[[mounts]]
  source = "leadlibre_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Siempre encendida y nunca más de una: el worker procesa los webhooks de Meta y los
  # programados en segundo plano, y el tiempo real (Socket.IO) requiere una sola réplica.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
