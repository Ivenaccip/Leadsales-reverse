# LeadLibre: CRM de WhatsApp (API oficial de Meta) sin mensualidad.
#
#   cp .env.example .env    # edita PUBLIC_URL y contraseñas
#   docker compose up -d                      # app + PostgreSQL
#   docker compose --profile https up -d      # + Caddy con HTTPS automático (requiere DOMAIN)
#
# La app se publica solo en 127.0.0.1: la usan Caddy o el proxy que tengas en este servidor.
# Un cliente que llegara directo al puerto por IPv6 entraría desde la puerta de enlace de
# Docker, que la app trata como proxy de confianza (podría elegir su IP con X-Forwarded-For).
# Para exponerla sin proxy define APP_BIND=0.0.0.0 y TRUST_PROXY=false (ver docs/04).
#
services:
  app:
    build: .
    image: leadlibre:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://leadlibre:${POSTGRES_PASSWORD:-leadlibre}@db:5432/leadlibre
      DATA_DIR: /data
    volumes:
      - leadlibre-data:/data
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadlibre
      POSTGRES_USER: leadlibre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadlibre}
    volumes:
      - leadlibre-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlibre -d leadlibre"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    # Red del host: Caddy ve la IP real de cada cliente, también por IPv6 (detrás de los puertos
    # publicados de Docker, los clientes IPv6 llegarían desde la puerta de enlace y compartirían
    # una sola IP en los límites de intentos). Usa los puertos 80 y 443 del servidor.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env para usar HTTPS}
      APP_PORT: ${APP_PORT:-3000}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  leadlibre-data:
  leadlibre-db:
  caddy-data:
